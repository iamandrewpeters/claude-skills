name = "faithmade-helpdesk"
main = "src/index.js"
compatibility_date = "2026-08-01"

# kb/*.md → src/kb-data.js and worker/ui/* → src/ui-data.js are generated by
# `npm run build` (run automatically by the dev/deploy/test scripts).

# Schema lives in migrations/ — apply with `npm run db:migrate` (remote) or
# `npm run db:migrate:local`. Wrangler records what has run, so it's safe to repeat.
[[d1_databases]]
binding = "DB"
database_name = "faithmade-helpdesk"
database_id = "c6006496-c14d-42c9-898a-c183d8930d03"
migrations_dir = "migrations"

[vars]
CLAUDE_MODEL = "claude-opus-5"
# Where this Worker is reachable — used for links in emails (inbox, reply links).
PUBLIC_URL = "https://helpdesk.faithmade.app"
# Inbound replies: Cloudflare Email Routing catch-all on this domain → this Worker.
REPLY_DOMAIN = "reply.faithmade.app"
EMAIL_FROM = "Leo · Faithmade <leo@reply.faithmade.app>"
# Who gets Leo's escalation emails and may coach Leo by replying (comma-separated).
TEAM_EMAILS = ""
# "resend" sends for real (needs RESEND_API_KEY); "log" only records to the Email log.
EMAIL_PROVIDER = "log"

# Secrets (npx wrangler secret put <NAME>):
#   ANTHROPIC_API_KEY      — Claude API key
#   WIDGET_SIGNING_SECRET  — shared with faithmade-admin (openssl rand -hex 32)
#   TOKEN_SECRET           — signs reply addresses, reply links, inbox sessions.
#                            Worker-only: never give it to tenant sites (openssl rand -hex 32)
#   ADMIN_KEY              — the inbox sign-in key
#   RESEND_API_KEY         — outbound email (docs/EMAIL-SETUP.md)
#   GHL_WEBHOOK_URL        — HighLevel inbound-webhook trigger URL for SMS (docs/GHL-SETUP.md)
